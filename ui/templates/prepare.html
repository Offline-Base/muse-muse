<header class="page-head">
  <h1>Prepare a question</h1>
  <p class="subtitle">Muse sees whatever you type into it. Write your question here with real names, and paste the tagged version into Muse instead.</p>
</header>
<form method="post" action="/prepare" class="controls">
  <div class="codebox"><label class="codebox-label" for="text">your question, kept on this device</label><textarea id="text" name="text" rows="6" maxlength="4000">$original</textarea></div>
  <div class="save-row"><button class="btn primary" type="submit">Tag it</button><span class="saved-note">$note</span></div>
</form>
$result_html
