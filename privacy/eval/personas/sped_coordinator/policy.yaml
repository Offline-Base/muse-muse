# Simulated persona's policy (invented): a special education coordinator. Not a person.
# Schema: docs/CONTRACTS.md, Policy section. Rules are checked top to bottom; the first match wins.
# IEP results are her job: they are asked about first (ask_first), never refused outright, and
# she shares IEP progress tagged once she has looked at it. Medical and the other never-share
# topics are still refused. Anything for staff outside her class waits for her OK each time.
# This persona exercises the ask_first and request:topic paths the strict teacher never uses.
name: Simulated special education coordinator (invented)

never_share:
  iep: ["IEP", "504 plan", "individualized education", "special education", "speech therapy", "accommodation plan", "resource room"]
  medical: ["diagnosis", "diagnosed", "ADHD", "medication", "allergy", "allergic", "asthma", "inhaler", "EpiPen", "therapist", "seizure", "nurse visit", "doctor"]
  discipline: ["suspension", "suspended", "detention", "office referral", "behavior referral", "incident report", "behavior plan"]
  custody: ["custody", "custodial", "restraining order", "visitation", "court order"]
  immigration: ["immigration", "undocumented", "visa", "green card", "deportation", "asylum", "refugee"]
  home_address: ["home address", "lives at", "street", "avenue", "apartment number", "mailing address"]
  parent_contact: ["parent phone", "parent email", "phone number", "email address", "cell phone", "emergency contact", "guardian contact", "contact sheet"]
  lunch_status: ["free lunch", "reduced lunch", "free or reduced", "free and reduced", "lunch status", "meal benefits", "lunch balance"]

# IEP results ask her first instead of being refused.
ask_first: [iep]

request_topics:
  parents: "meant for a student's family: parents, guardians, a note or letter home, a family newsletter, a family conference"
  third_party: "meant for someone outside this class other than families: other teachers or staff, the principal, the district, a club, a contest or showcase, a grant, a school newsletter, anything posted or published"
  full_text: "asks for a student's whole piece of writing, word for word or in full, or many students' full pieces together (not a search, a quote, an excerpt or a summary)"
  deanonymize: "asks who a tag really is: real or full names, unmasking, matching tags to people"
  class_level: "asks for class-level numbers or patterns (an average, a count, a distribution, a trend) rather than per-student detail"

identifier_topics:
  phone: parent_contact
  email: parent_contact
  address: home_address

rules:
  - id: refuse_other_sensitive
    topics_any: [medical, discipline, custody, immigration, home_address, parent_contact, lunch_status]
    wants: refuse
    on_ask: {approve: false, remember: true}

  - id: no_unmasking_requests
    request_any: ["real name", "full name", "actual name", "who is [student", "unmask", "names behind the tags"]
    wants: refuse
    on_ask: {approve: false, remember: true}

  - id: no_reidentifying
    topics_any: [deanonymize, reidentify]
    wants: refuse
    on_ask: {approve: false, remember: true}

  # IEP progress: she looks at each one and then shares it tagged (no "don't ask again").
  - id: iep_progress_after_asking
    topics_any: [iep]
    wants: ask_user
    on_ask: {approve: true, remember: false}

  - id: list_documents_ok
    kinds: [document_list]
    wants: share_tagged
    pre_approved: true
    on_ask: {approve: true, remember: true}

  - id: ask_before_parents
    topics_any: [parents]
    wants: ask_user
    on_ask: {approve: true, remember: false}

  # Other teachers and staff: she approves, but looks every time.
  - id: ask_before_outside_class
    topics_any: [third_party]
    wants: ask_user
    on_ask: {approve: true, remember: false}

  - id: ask_before_full_text
    topics_any: [full_text]
    wants: ask_user
    on_ask: {approve: true, remember: false}

  - id: class_statistics
    kinds: [class_aggregate]
    wants: share_summary
    on_ask: {approve: true, remember: true}

  - id: tagged_grades_and_excerpts
    kinds: [per_student, snippet, free_text]
    topics_any: [grades, writing]
    wants: share_tagged
    on_ask: {approve: true, remember: true}

default: {wants: ask_user, on_ask: {approve: false, remember: false}}
