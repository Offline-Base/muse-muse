# Simulated persona's policy (invented): a caseworker at the Varrowby Housing Assistance Office,
# an invented city office whose invented federal grant agreement marks its case files as
# Controlled Unclassified Information. Not a person, and not a statement about any real agency.
# Schema: docs/CONTRACTS.md, Policy section. Rules are checked top to bottom; the first match wins.
# Nothing goes to Muse: the CUI toggle (persona.yaml) keeps every result on the device, and this
# policy refuses everything too, so the expected outcome of every item is a fixed "Kept on your
# device" sentence. The caseworker asks questions on the device's own Ask page instead.
name: Simulated city housing caseworker (invented)

never_share:
  income: ["income", "wages", "benefit amount", "pay stub"]
  immigration: ["immigration", "undocumented", "visa", "green card", "deportation", "asylum", "refugee"]
  medical: ["diagnosis", "diagnosed", "medication", "disability"]
  client_contact: ["phone number", "email address", "cell phone", "emergency contact"]
  home_address: ["home address", "lives at", "street", "avenue", "apartment number", "mailing address"]

ask_first: []

request_topics:
  third_party: "meant for someone outside this office: a landlord, another agency, a newsletter, anything posted or published"
  deanonymize: "asks who a tag really is: real or full names, unmasking, matching tags to people"
  class_level: "asks for office-level numbers or patterns (a count, an average, a weekly total) rather than one client's case"

identifier_topics:
  phone: client_contact
  email: client_contact
  address: home_address

rules:
  - id: never_share_topics
    topics_any: [income, immigration, medical, client_contact, home_address]
    wants: refuse
    on_ask: {approve: false, remember: true}

  - id: no_unmasking_requests
    request_any: ["real name", "full name", "actual name", "unmask", "names behind the tags"]
    wants: refuse
    on_ask: {approve: false, remember: true}

# Case files stay in the office: everything else is refused too.
default: {wants: refuse, on_ask: {approve: false, remember: true}}
