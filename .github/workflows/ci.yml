# The site's typecheck and unit tests, the commands in README.md's Tests section. Muse Privacy has its own workflow, privacy.yml.
# No secrets: nothing in these tests calls Meta, Vercel, Lambda or Neon.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["privacy/**"]
  pull_request:
    paths-ignore: ["privacy/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install from the lock file
        run: npm ci --no-audit --no-fund
      - name: Generate Next.js types
        run: npx next typegen
      - name: Type check
        run: npm run typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install from the lock file
        run: npm ci --no-audit --no-fund
      - name: Library and component tests
        run: npx tsx --test --experimental-test-module-mocks $(find lib components -name '*.test.ts')
      - name: Fine-tuning view tests
        run: npx tsx --test --experimental-test-module-mocks components/train/__tests__/*.test.tsx
      # The template's tests import its own packages (openai, next, react, typescript, @playwright/test), which the
      # root lock file doesn't have. No scripts run, so no browser is downloaded.
      - name: Install the template's own packages
        run: npm ci --prefix template --no-audit --no-fund --ignore-scripts
      - name: The template's own scripts
        run: npx tsx --test template/scripts/__tests__/*.test.mjs
