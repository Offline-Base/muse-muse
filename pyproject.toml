[project]
name = "muse-privacy"
version = "0.1.0"
description = "A Muse connector that gives Muse a private workspace on your own device."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162",
    "uvicorn>=0.54",
    "httpx>=0.28",
    "pydantic>=2.14",
    "pyyaml>=6.0",
    "mcp>=2.3",
    "websockets>=15",
    "matplotlib>=3.11",
    "pyserial>=3.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "respx>=0.23",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["base", "eval", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: calls a real external service; set RUN_INTEGRATION=1"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["relay", "hardware/enclosure/out"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
